<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Growth Radar</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><header><div><small>DIGITAL INTELLIGENCE</small><h1>Digital Growth Radar</h1><p>Official product updates, prioritised for marketing and digital growth.</p></div><button id="logout" hidden>Sign out</button></header><section id="login" class="panel"><h2>Team sign in</h2><form id="loginForm"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form><p id="authMessage" role="status"></p></section><section id="dashboard" hidden><div class="toolbar"><input id="search" placeholder="Search feature updates..." aria-label="Search updates"><select id="category" aria-label="Category"><option value="">All categories</option><option value="ai">AI</option><option value="social">Social</option><option value="creative">Creative</option><option value="martech">Martech</option><option value="web">Web</option></select><select id="priority" aria-label="Priority"><option value="">All priorities</option><option value="critical">Critical</option><option value="important">Important</option><option value="informational">Informational</option></select><button id="refresh">Refresh</button><button id="enableNotifications">Enable alerts</button></div><div class="stats"><div class="panel"><span>Total updates</span><strong id="total">—</strong></div><div class="panel"><span>Critical updates</span><strong id="critical">—</strong></div><div class="panel"><span>Latest detection</span><strong id="latest">—</strong></div></div><p id="status" role="status"></p><div id="updates" class="updates"></div><button id="more" hidden>Load more</button></section><footer>Near-real-time monitoring · 15-minute scheduled collection · Always verify rollout availability</footer></main><script type="module" src="app.js"></script></body></html>
