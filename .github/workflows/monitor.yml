
name: Digital Growth Radar Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secrets
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          test -n "$MONITOR_URL" || { echo "MONITOR_URL missing"; exit 1; }
          test -n "$MONITOR_SECRET" || { echo "MONITOR_SECRET missing"; exit 1; }

      - name: Run Supabase monitor
        env:
          MONITOR_URL: ${{ secrets.MONITOR_URL }}
          MONITOR_SECRET: ${{ secrets.MONITOR_SECRET }}
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 2 \
            --max-time 180 \
            --request POST \
            --url "$MONITOR_URL" \
            --header "Content-Type: application/json" \
            --header "x-monitor-secret: $MONITOR_SECRET" \
            --data '{}'
